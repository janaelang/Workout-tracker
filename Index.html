<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strength Architect: Analytics Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #007AFF; --secondary: #34C759; --bg: #f0f2f5; --superset: #AF52DE; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); padding: 10px; padding-bottom: 160px; color: #1a1a1a; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .exercise-card { background: #fff; border: 1px solid #eee; padding: 15px; margin-bottom: 12px; border-radius: 12px; }
        .is-superset { border-left: 8px solid var(--superset); border-top-left-radius: 0; margin-top: -15px; }
        .prev-data { font-size: 0.8em; color: #007AFF; font-weight: 600; margin: 5px 0; }
        .log-row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
        input, textarea, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        .btn { background: var(--primary); color: white; border: none; padding: 14px; border-radius: 10px; cursor: pointer; width: 100%; font-size: 16px; font-weight: 600; margin-top: 10px; }
        .btn-ghost { background: transparent; color: var(--primary); border: 1px solid var(--primary); }
        .hidden { display: none; }
        .badge { background: #eef2f3; padding: 2px 6px; border-radius: 4px; font-size: 0.8em; }
        .timer-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #1c1c1e; color: white; padding: 15px; text-align: center; z-index: 1000; border-top: 1px solid #333; }
    </style>
</head>
<body>

<div id="workoutView" class="container hidden">
    <h2 id="activePhaseTitle">Current Phase</h2>
    <div id="activeExercises"></div>
    <button class="btn" style="background:var(--secondary)" onclick="finishWorkout()">✅ Log Session</button>
    <button class="btn btn-ghost" onclick="showAnalytics()">View Progress Charts</button>
    <button class="btn btn-ghost" onclick="showSetup()">New Phase / Edit Plan</button>
</div>

<div id="analyticsView" class="container hidden">
    <h2>📈 Progress Chart</h2>
    <label>Select Exercise</label>
    <select id="chartExSelect" onchange="updateChart()"></select>
    <div style="margin-top:20px; height: 300px;">
        <canvas id="progressChart"></canvas>
    </div>
    <button class="btn" onclick="showWorkout()">Back to Workout</button>
</div>

<div id="setupView" class="container hidden">
    <h2>🏗 Phase Setup</h2>
    <input type="text" id="phaseName" placeholder="Phase Name (e.g. Block 2: Max Strength)">
    <div id="exerciseList" style="margin-top: 15px;"></div>
    <button class="btn btn-ghost" onclick="addExerciseField()">+ Add Exercise</button>
    <button class="btn" style="background:var(--secondary)" onclick="savePhase()">Save Phase</button>
</div>

<div class="timer-bar">
    <div id="timerDisplay" style="color:var(--secondary); font-weight:bold; margin-bottom:8px;">REST TIMER: 00:00</div>
    <div style="display:flex; gap:5px; justify-content:center;">
        <button onclick="startTimer(60)" class="btn" style="margin:0; padding:8px; width:60px;">1m</button>
        <button onclick="startTimer(180)" class="btn" style="margin:0; padding:8px; width:60px;">3m</button>
        <button onclick="startTimer(300)" class="btn" style="margin:0; padding:8px; width:60px;">5m</button>
    </div>
</div>

<script>
    let appData = JSON.parse(localStorage.getItem('workoutAppData')) || { currentPhase: null, history: [] };
    let myChart = null;

    function init() {
        if (appData.currentPhase) showWorkout(); else showSetup();
    }

    function addExerciseField(data = null) {
        const div = document.createElement('div');
        div.className = 'exercise-card';
        div.innerHTML = `
            <input type="text" placeholder="Exercise Name" class="ex-name" value="${data?.name || ''}">
            <div style="display:flex; gap:10px; margin-top:8px;">
                <input type="number" placeholder="Sets" class="ex-sets" value="${data?.sets || ''}">
                <input type="number" placeholder="Reps" class="ex-reps" value="${data?.reps || ''}">
            </div>
            <label style="font-size:12px; margin-top:8px; display:block;">
                <input type="checkbox" class="ex-super" ${data?.isSuperset ? 'checked' : ''}> Superset with above?
            </label>
        `;
        document.getElementById('exerciseList').appendChild(div);
    }

    function savePhase() {
        const cards = document.querySelectorAll('#exerciseList .exercise-card');
        let exercises = [];
        cards.forEach(card => {
            exercises.push({
                name: card.querySelector('.ex-name').value,
                sets: card.querySelector('.ex-sets').value,
                reps: card.querySelector('.ex-reps').value,
                isSuperset: card.querySelector('.ex-super').checked
            });
        });
        appData.currentPhase = { name: document.getElementById('phaseName').value, exercises };
        localStorage.setItem('workoutAppData', JSON.stringify(appData));
        showWorkout();
    }

    function showWorkout() {
        hideAll(); document.getElementById('workoutView').classList.remove('hidden');
        document.getElementById('activePhaseTitle').innerText = appData.currentPhase.name;
        const container = document.getElementById('activeExercises');
        container.innerHTML = '';

        appData.currentPhase.exercises.forEach((ex, idx) => {
            const last = appData.history.find(s => s.results.some(r => r.name.toLowerCase() === ex.name.toLowerCase()));
            const card = document.createElement('div');
            card.className = `exercise-card ${ex.isSuperset ? 'is-superset' : ''}`;
            let html = `<h3>${ex.name}</h3>`;
            if(last) {
                const r = last.results.find(res => res.name.toLowerCase() === ex.name.toLowerCase());
                html += `<div class="prev-data">Prev: ${r.weights.join('/')}kg (${last.date})</div>`;
            }
            html += `<div id="sets-${idx}"></div><textarea placeholder="Notes..." class="note-${idx}"></textarea>`;
            card.innerHTML = html;
            container.appendChild(card);

            for(let i=1; i<=ex.sets; i++) {
                const row = document.createElement('div');
                row.className = 'log-row';
                row.innerHTML = `<span>S${i}</span><input type="number" placeholder="kg" class="w-${idx}"><input type="number" placeholder="reps" class="r-${idx}" value="${ex.reps}">`;
                document.getElementById(`sets-${idx}`).appendChild(row);
            }
        });
    }

    function finishWorkout() {
        const log = { date: new Date().toLocaleDateString(), phase: appData.currentPhase.name, results: [] };
        appData.currentPhase.exercises.forEach((ex, idx) => {
            log.results.push({
                name: ex.name,
                weights: Array.from(document.querySelectorAll(`.w-${idx}`)).map(i => parseFloat(i.value) || 0),
                reps: Array.from(document.querySelectorAll(`.r-${idx}`)).map(i => parseFloat(i.value) || 0),
                note: document.querySelector(`.note-${idx}`).value
            });
        });
        appData.history.unshift(log);
        localStorage.setItem('workoutAppData', JSON.stringify(appData));
        alert("Saved!");
        location.reload();
    }

    function showAnalytics() {
        hideAll(); document.getElementById('analyticsView').classList.remove('hidden');
        const select = document.getElementById('chartExSelect');
        const uniqueEx = [...new Set(appData.history.flatMap(s => s.results.map(r => r.name)))];
        select.innerHTML = uniqueEx.map(ex => `<option value="${ex}">${ex}</option>`).join('');
        updateChart();
    }

    function updateChart() {
        const exName = document.getElementById('chartExSelect').value;
        const history = [...appData.history].reverse();
        const dataPoints = [];
        const labels = [];

        history.forEach(session => {
            const res = session.results.find(r => r.name === exName);
            if (res) {
                const maxW = Math.max(...res.weights);
                const maxR = res.reps[res.weights.indexOf(maxW)];
                const est1RM = maxW * (36 / (37 - maxR)); // Brzycki Formula
                dataPoints.push(est1RM.toFixed(1));
                labels.push(session.date);
            }
        });

        if (myChart) myChart.destroy();
        const ctx = document.getElementById('progressChart').getContext('2d');
        myChart = new Chart(ctx, {
            type: 'line',
            data: { labels, datasets: [{ label: 'Est. 1RM (kg)', data: dataPoints, borderColor: '#007AFF', tension: 0.3, fill: true, backgroundColor: 'rgba(0,122,255,0.1)' }] },
            options: { responsive: true, maintainAspectRatio: false }
        });
    }

    function startTimer(s) {
        let t = s;
        clearInterval(window.tInt);
        window.tInt = setInterval(() => {
            t--;
            document.getElementById('timerDisplay').innerText = `RESTING: ${Math.floor(t/60)}:${(t%60).toString().padStart(2,'0')}`;
            if(t<=0) { clearInterval(window.tInt); document.getElementById('timerDisplay').innerText = "LIFT NOW!"; }
        }, 1000);
    }

    function showSetup() {
        hideAll(); document.getElementById('setupView').classList.remove('hidden');
        if(appData.currentPhase) {
            document.getElementById('phaseName').value = appData.currentPhase.name;
            document.getElementById('exerciseList').innerHTML = '';
            appData.currentPhase.exercises.forEach(ex => addExerciseField(ex));
        }
    }

    function hideAll() { ['workoutView','analyticsView','setupView'].forEach(id => document.getElementById(id).classList.add('hidden')); }
    init();
</script>
</body>
</html>
